<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Écologie Consciente - Mathieu Barbaud</title>
    <style>
        :root { --primary: #1a2a6c; --secondary: #b21f1f; --accent: #27ae60; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; color: #333; max-width: 900px; margin: 0 auto; padding: 20px; background-color: var(--bg); }
        
        /* Menu de Navigation */
        .main-menu { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; }
        .menu-btn { padding: 12px 25px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; background: white; color: var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .menu-btn.active { background: var(--primary); color: white; }

        .module { display: none; }
        .module.active { display: block; animation: fadeIn 0.4s; }

        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; }
        h1 { color: var(--primary); text-align: center; margin-bottom: 5px; }
        h2 { color: var(--secondary); border-left: 5px solid #fdbb2d; padding-left: 15px; margin-top: 0; margin-bottom: 20px;}
        
        .field { margin-bottom: 25px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #2c3e50; }
        
        /* Sliders & Inputs */
        .slider-container { display: flex; align-items: center; gap: 20px; background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        input[type="range"] { flex-grow: 1; accent-color: var(--secondary); }
        input[type="text"], select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        
        /* Module 2 Spécifique */
        .sadhana-selector { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; background: #f0f4f8; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        .selector-box { display: flex; flex-direction: column; gap: 10px; }
        .selector-box span { font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        
        .sadhana-display { border-top: 2px solid #eee; padding-top: 20px; }
        .time-section { margin-bottom: 25px; }
        .time-title { font-size: 0.9em; font-weight: bold; text-transform: uppercase; color: #7f8c8d; margin-bottom: 10px; display: block; }
        
        .sadhana-item { display: flex; align-items: center; background: white; padding: 12px 15px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #eee; transition: 0.3s; }
        .sadhana-item.done { background: #e8f5e9; border-color: var(--accent); opacity: 0.8; }
        .sadhana-item input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: var(--accent); }
        .sadhana-item span { flex-grow: 1; margin-left: 15px; font-weight: 500; }
